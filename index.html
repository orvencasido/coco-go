<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CocoGo - Offline Philippine Transit AI Assistant</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0b1120;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone-frame {
        width: 100%;
        max-width: 440px;
        height: 100%;
        max-height: 900px;
        background-color: #ffffff;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 4px solid #1e293b;
      }
      @media (max-width: 480px) {
        .phone-frame {
          max-width: 100%;
          max-height: 100%;
          border-radius: 0;
          border: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
