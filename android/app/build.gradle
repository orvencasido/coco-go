apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def jscFlavor = 'io.github.react-native-community:jsc-android:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cocogo"
    sourceSets {
        main.assets.srcDirs += ["../../src/assets/models"]
    }
    aaptOptions {
        noCompress "gguf"
    }
    defaultConfig {
        applicationId "com.cocogo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // Native ABI filters for modern mobile processors & emulators
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        // External native build options for llama.cpp / C++ JSI modules
        externalNativeBuild {
            cmake {
                cppFlags "-O3 -flto -fexceptions -frtti -std=c++17"
                arguments "-DANDROID_STL=c++_shared",
                          "-DGGML_OPENMP=OFF",
                          "-DGGML_VULKAN=ON"
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

tasks.register("verifyBundledModel") {
    doLast {
        def model = file("../../src/assets/models/qwen2.5-1.5b-instruct-q4_k_m.gguf")
        if (!model.exists()) {
            println("ℹ️ Pre-bundled model not found in assets. The app will use on-demand download / sideloading via ModelManagerScreen.")
        } else {
            println("✅ Found pre-bundled model: ${model.name} (${model.length()} bytes)")
        }
    }
}
tasks.named("preBuild").configure {
    dependsOn("verifyBundledModel")
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

